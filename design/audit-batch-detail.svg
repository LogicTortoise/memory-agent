<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img"><title>Memory Agent 批次原话与提案对照静态设计</title><desc>Memory Agent 审计 UI 静态设计，内容均为虚构示例，不连接运行数据。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#20304A}</style><rect x="0" y="0" width="1440" height="960" rx="0" fill="#F5F7FA"/><rect x="0" y="0" width="208" height="960" rx="0" fill="#FFFFFF"/><path d="M208 0 L208 960" stroke="#D6DEE8" fill="none"/><text x="24" y="44" font-size="21" font-weight="600">Memory Agent</text><text x="24" y="69" font-size="13" font-weight="400" style="fill:#596A82">个人记忆审计</text><text x="28" y="120" font-size="15" font-weight="400" style="fill:#596A82">处理概览</text><text x="28" y="174" font-size="15" font-weight="400" style="fill:#596A82">会话与来源</text><rect x="12" y="202" width="184" height="42" rx="6" fill="#EAF1FA"/><rect x="12" y="210" width="3" height="26" rx="1" fill="#315D92"/><text x="28" y="228" font-size="15" font-weight="600" style="fill:#315D92">处理批次</text><text x="28" y="282" font-size="15" font-weight="400" style="fill:#596A82">记忆与决定</text><text x="28" y="336" font-size="15" font-weight="400" style="fill:#596A82">查询审计</text><text x="28" y="390" font-size="15" font-weight="400" style="fill:#596A82">分类与系统</text><path d="M24 850 L184 850" stroke="#D6DEE8" fill="none"/><text x="24" y="882" font-size="13" font-weight="400" style="fill:#596A82">本机工作区</text><text x="24" y="908" font-size="12" font-weight="400" style="fill:#596A82">静态设计 · 示例数据</text><rect x="208" y="0" width="1232" height="72" rx="0" fill="#FFFFFF"/><path d="M208 72 L1440 72" stroke="#D6DEE8" fill="none"/><text x="240" y="43" font-size="14" font-weight="400" style="fill:#596A82">工作区 / Memory Agent</text><rect x="1174" y="24" width="108" height="26" rx="5" fill="#EEF2F7"/><text x="1184" y="42" font-size="12" font-weight="500" style="fill:#246750">后台运行中</text><text x="1302" y="43" font-size="12" font-weight="400" style="fill:#596A82">浅色 / 深色</text><text x="240" y="114" font-size="13" font-weight="400" style="fill:#596A82">处理批次 / B-03</text><text x="240" y="152" font-size="27" font-weight="600">原话与提案对照</text><rect x="479" y="130" width="82" height="26" rx="5" fill="#EEF2F7"/><text x="489" y="148" font-size="12" font-weight="500" style="fill:#246750">已完成</text><rect x="574" y="130" width="82" height="26" rx="5" fill="#FFF3DB"/><text x="584" y="148" font-size="12" font-weight="500" style="fill:#89570C">1 项待决</text><text x="240" y="181" font-size="13" font-weight="400" style="fill:#596A82">Claude Code / s1 · 第 11–15 轮 · 输入 4,800 tokens · 目标原文未裁剪</text><rect x="240" y="206" width="648" height="674" rx="6" fill="#FFFFFF" stroke="#D6DEE8"/><rect x="908" y="206" width="496" height="674" rx="6" fill="#FFFFFF" stroke="#D6DEE8"/><text x="260" y="241" font-size="18" font-weight="600">会话原文</text><text x="726" y="241" font-size="12" font-weight="400" style="fill:#596A82">5 轮 / 按原顺序</text><path d="M260 259 L868 259" stroke="#D6DEE8" fill="none"/><text x="260" y="292" font-size="13" font-weight="600" style="fill:#596A82">第 11 轮</text><rect x="338" y="273" width="54" height="26" rx="5" fill="#EEF2F7"/><text x="348" y="291" font-size="12" font-weight="500" style="fill:#596A82">用户</text><text x="260" y="327" font-size="16" font-weight="500">这次生成视频时，保留原片的声音。</text><text x="260" y="358" font-size="14" font-weight="400" style="fill:#596A82">助手：明白，保留原始音轨。</text><path d="M260 382 L868 382" stroke="#D6DEE8" fill="none"/><text x="260" y="413" font-size="13" font-weight="600" style="fill:#596A82">第 12 轮</text><rect x="338" y="394" width="54" height="26" rx="5" fill="#EEF2F7"/><text x="348" y="412" font-size="12" font-weight="500" style="fill:#596A82">用户</text><rect x="254" y="432" width="620" height="68" rx="4" fill="#EAF1FA"/><text x="268" y="457" font-size="16" font-weight="500">人物换脸即可，服装、背景和时长都不要改。</text><text x="268" y="484" font-size="12" font-weight="400" style="fill:#315D92">被候选 C-02 引用 · u42 · 原始文本范围已核对</text><text x="260" y="531" font-size="14" font-weight="400" style="fill:#596A82">助手：按人物面部替换处理。</text><text x="260" y="564" font-size="13" font-weight="400" style="fill:#596A82">工具输出已折叠：媒体元信息 2 条</text><path d="M260 586 L868 586" stroke="#D6DEE8" fill="none"/><text x="260" y="623" font-size="14" font-weight="400">第 13 轮   输出文件格式与保存位置</text><text x="818" y="623" font-size="13" font-weight="400" style="fill:#315D92">展开</text><text x="260" y="671" font-size="14" font-weight="400">第 14 轮   对上一版结果的补充说明</text><text x="818" y="671" font-size="13" font-weight="400" style="fill:#315D92">展开</text><text x="260" y="719" font-size="14" font-weight="400">第 15 轮   本次任务的收尾确认</text><text x="818" y="719" font-size="13" font-weight="400" style="fill:#315D92">展开</text><rect x="260" y="782" width="608" height="70" rx="5" fill="#EEF2F7"/><text x="274" y="809" font-size="13" font-weight="600">处理范围</text><text x="274" y="833" font-size="13" font-weight="400" style="fill:#596A82">5 轮目标内容；无重叠轮次；工具原文可按引用查看。</text><text x="928" y="241" font-size="18" font-weight="600">候选与决定</text><path d="M928 259 L1384 259" stroke="#D6DEE8" fill="none"/><rect x="928" y="278" width="62" height="26" rx="5" fill="#EEF2F7"/><text x="938" y="296" font-size="12" font-weight="500" style="fill:#596A82">C-02</text><text x="1004" y="297" font-size="13" font-weight="400" style="fill:#246750">已提交</text><text x="928" y="333" font-size="16" font-weight="600">本次视频任务只替换人物面部，</text><text x="928" y="361" font-size="16" font-weight="600">保留服装、背景和原片时长。</text><text x="928" y="405" font-size="12" font-weight="400" style="fill:#596A82">适用范围</text><text x="1032" y="405" font-size="13" font-weight="400">本次视频任务</text><text x="928" y="443" font-size="12" font-weight="400" style="fill:#596A82">抽象层级</text><text x="1032" y="443" font-size="13" font-weight="400">具体要求</text><text x="928" y="481" font-size="12" font-weight="400" style="fill:#596A82">时间属性</text><text x="1032" y="481" font-size="13" font-weight="400">临时；任务范围限定</text><text x="928" y="519" font-size="12" font-weight="400" style="fill:#596A82">证据</text><text x="1032" y="519" font-size="13" font-weight="400">第 12 轮用户原话 u42</text><path d="M928 548 L1384 548" stroke="#D6DEE8" fill="none"/><text x="928" y="581" font-size="17" font-weight="600">另一项提案需要澄清</text><text x="928" y="611" font-size="14" font-weight="400" style="fill:#596A82">新要求与此前保存的范围不同。</text><text x="928" y="638" font-size="14" font-weight="400" style="fill:#596A82">先核对新旧原话，再决定是否替换。</text><rect x="928" y="662" width="456" height="79" rx="5" fill="#FFF3DB"/><text x="942" y="691" font-size="14" font-weight="600" style="fill:#89570C">未确认时保持待决</text><text x="942" y="718" font-size="13" font-weight="400" style="fill:#89570C">不会把“这次”升级成长期全局规则。</text><rect x="928" y="765" width="143" height="36" rx="6" fill="#315D92"/><text x="943" y="789" font-size="13" font-weight="600" style="fill:#F5F7FA">打开冲突对照</text><rect x="1085" y="765" width="109" height="36" rx="6" fill="#FFFFFF" stroke="#D6DEE8"/><text x="1100" y="789" font-size="13" font-weight="600" style="fill:#20304A">查看版本</text><text x="928" y="839" font-size="12" font-weight="400" style="fill:#596A82">提案操作检查版本，过期按钮不能提交。</text><text x="240" y="922" font-size="12" font-weight="400" style="fill:#596A82">静态设计稿，原话、编号、状态与统计均为虚构示例。</text></svg>