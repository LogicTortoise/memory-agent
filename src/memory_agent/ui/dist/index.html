    <title>memory-agent audit</title>
    <script>
      // Runtime config injected by the Python entry point. The server
      // stamps the actual loopback origin + session token onto the page
      // so the React app can POST /api/v1/commands without ever seeing
      // a CORS-allowlisted origin that isn't itself.
      window.__MA_CONFIG__ = window.__MA_CONFIG__ || {
        origin: window.location.origin,
        sessionToken: null,
      };
      // Read the persisted sidebar state BEFORE React mounts so the
      // first frame already matches the user's last choice. Without
      // this the page would briefly flash the expanded labels even for
      // users who collapsed the sidebar.
      try {
        var _stored = window.localStorage.getItem("ma-sidebar");
        document.documentElement.dataset.sidebar =
          _stored === "expanded" ? "expanded" : "collapsed";
      } catch (_e) {
        document.documentElement.dataset.sidebar = "collapsed";
      }
    </script>
